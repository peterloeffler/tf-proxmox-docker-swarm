################################
# 🦎 KOMODO SWARM STACK 🦎 #
################################

## This stack file will deploy:
##   1. MongoDB          (1 replica, data on CephFS)
##   2. Komodo Core      (1 replica, keys + backups on CephFS)
##   3. Komodo Periphery (global, one task per swarm node)
##
## All persistent data lives under /mnt/cephfs/komodo, so every service can be
## rescheduled onto any swarm node. The lightwhale nodes themselves are stateless.
##
## Deploy with:
##   set -a && . ./compose.env && set +a && docker stack deploy -c komodo.compose.yaml komodo

services:
  mongo:
    ## Pinned to 7: mongo 8+ refuses to start on lightwhale's kernel 6.19
    ## (TCMalloc violates the rseq ABI) - https://jira.mongodb.org/browse/SERVER-121912
    image: mongo:7
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    # ports:
    #   - 27017:27017
    volumes:
      - /mnt/cephfs/komodo/mongo/data:/data/db
      - /mnt/cephfs/komodo/mongo/config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    ports:
      - 9120:9120
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
    volumes:
      ## Attach the Core / Periphery communication keys
      - /mnt/cephfs/komodo/keys:/config/keys
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      ## Store sync files on server
      # - /mnt/cephfs/komodo/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /mnt/cephfs/komodo/core.config.toml:/config/config.toml
      ## Optionally mount custom root CA certificate to trust
      # - /mnt/cephfs/komodo/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  ## Periphery runs as a global service, so every swarm node is manageable.
  ## Each task registers with Core under its own node hostname and gets its own
  ## root directory on CephFS. {{.Node.Hostname}} is expanded by swarm per task.
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    env_file: ./compose.env
    environment:
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      PERIPHERY_ROOT_DIRECTORY: /mnt/cephfs/komodo/periphery/{{.Node.Hostname}}
      ## Without this every task would register with Core under the same name
      PERIPHERY_CONNECT_AS: "{{.Node.Hostname}}"
    volumes:
      ## Attach the Core / Periphery communication keys
      - /mnt/cephfs/komodo/keys:/config/keys
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## All your configs / repos must be children of this directory for Periphery to be able to see it.
      - /mnt/cephfs/komodo/periphery/{{.Node.Hostname}}:/mnt/cephfs/komodo/periphery/{{.Node.Hostname}}
      ## Optionally mount a custom periphery.config.toml
      # - /mnt/cephfs/komodo/periphery.config.toml:/config/config.toml
      ## Optionally mount custom root CA certificate to trust
      # - /mnt/cephfs/komodo/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt
    deploy:
      mode: global
      restart_policy:
        condition: any
